aid: atla
name: Atla
description: >-
  Atla builds frontier AI evaluation models (Selene) and Atla Insights, an
  observability platform for monitoring and improving AI agents. Its Insights
  Data API exposes OpenTelemetry-based traces and spans of instrumented agent
  runs — list with time-window and metadata filters, fetch multiple by ID, and
  retrieve a single trace with full spans, summaries, and custom metrics. Atla
  ships official Python and JavaScript SDKs and an MCP server. The company is
  UK-based and backed by Creandum. Note: the Atla Insights platform is scheduled
  to sunset on 16 February 2026, and the separate Selene evaluation API SDK and
  MCP server were archived in 2025.
